<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#173b35" />
  <title>Голос — 30 дней практики</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">◌</span>
      <div>
        <h1>Голос</h1>
        <p>30 дней свободного звучания</p>
      </div>
    </div>
    <button class="ghost-button" id="resetProgress" type="button">Сбросить прогресс</button>
  </header>

  <main class="app-shell">
    <section class="hero-card">
      <div>
        <p class="eyebrow">Ежедневная практика</p>
        <h2 id="dayTitle">День 1</h2>
        <p id="dayGoal" class="hero-copy"></p>
      </div>
      <div class="progress-wrap" aria-label="Прогресс курса">
        <div class="progress-number"><strong id="completedCount">0</strong><span>/30</span></div>
        <div class="progress-bar"><span id="progressBar"></span></div>
        <small>дней завершено</small>
      </div>
    </section>

    <div class="layout">
      <aside class="day-sidebar">
        <div class="sidebar-heading">
          <h3>Дни курса</h3>
          <span id="sidebarStatus">Сегодня</span>
        </div>
        <nav id="dayList" class="day-list" aria-label="Дни курса"></nav>
      </aside>

      <section class="lesson-panel" aria-live="polite">
        <div class="lesson-meta">
          <span id="weekLabel" class="pill"></span>
          <span id="durationLabel" class="pill muted-pill"></span>
        </div>
        <div id="lessonContent"></div>
        <div class="lesson-footer">
          <button id="completeButton" class="complete-button" type="button">Завершено</button>
          <p id="completionNote" class="completion-note"></p>
        </div>
      </section>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
